---
# Mini Finance Deployment Playbook
# Assignment 36 - Multi-Play Structure

# ============================================================
# Play 1: Install and Start Nginx Web Server
# ============================================================
- name: Install and Start Nginx Web Server
  hosts: web
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: install

    - name: Install Nginx
      apt:
        name: nginx
        state: present
      tags: install

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes
      tags: install

    - name: Verify Nginx is listening on port 80
      wait_for:
        port: 80
        timeout: 30
      tags: install

# ============================================================
# Play 2: Deploy Mini Finance Website
# ============================================================
- name: Deploy Mini Finance Website
  hosts: web
  become: yes
  tasks:
    - name: Install git package
      apt:
        name: git
        state: present
      tags: deploy

    - name: Remove existing /tmp/mini_finance directory
      file:
        path: /tmp/mini_finance
        state: absent
      tags: deploy

    - name: Clone Mini Finance repository from GitHub
      git:
        repo: "https://github.com/pravinmishraaws/mini_finance.git"
        dest: "/tmp/mini_finance"
        version: main
      tags: deploy

    - name: Verify repository was cloned
      stat:
        path: /tmp/mini_finance
      register: repo_stat
      tags: deploy

    - name: Fail if repository not cloned
      fail:
        msg: "Repository was not cloned successfully"
      when: not repo_stat.stat.exists
      tags: deploy

    - name: Remove existing content in /var/www/html
      file:
        path: /var/www/html/
        state: absent
      tags: deploy

    - name: Recreate /var/www/html directory
      file:
        path: /var/www/html
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      tags: deploy

    - name: Copy website content to nginx web root
      copy:
        src: "/tmp/mini_finance/"
        dest: "/var/www/html/"
        owner: www-data
        group: www-data
        mode: "0755"
        remote_src: yes
      tags: deploy

    - name: Verify index.html exists
      stat:
        path: /var/www/html/index.html
      register: index_file
      tags: deploy

    - name: Fail if index.html does not exist
      fail:
        msg: "index.html not found in /var/www/html/"
      when: not index_file.stat.exists
      tags: deploy

# ============================================================
# Play 3: Configure Nginx to Serve the Site
# ============================================================
- name: Configure Nginx to Serve the Site
  hosts: web
  become: yes
  tasks:
    - name: Configure nginx default site
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              server_name _;

              root /var/www/html;
              index index.html index.htm;

              access_log /var/log/nginx/minifinance_access.log;
              error_log /var/log/nginx/minifinance_error.log;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              # Security headers
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-XSS-Protection "1; mode=block" always;

              error_page 404 /index.html;
          }
        owner: root
        group: root
        mode: "0644"
      tags: configure

    - name: Test nginx configuration
      command: nginx -t
      changed_when: false
      tags: configure

# ============================================================
# Play 4: Restart Nginx After Configuration
# ============================================================
- name: Restart Nginx After Configuration
  hosts: web
  become: yes
  tasks:
    - name: Restart nginx to apply changes
      service:
        name: nginx
        state: restarted
      tags: restart

    - name: Wait for nginx to be ready
      wait_for:
        port: 80
        timeout: 30
      tags: restart

    - name: Verify nginx is running
      service:
        name: nginx
        state: started
      tags: restart

# ============================================================
# Play 5: Verify Deployment
# ============================================================
- name: Verify Deployment
  hosts: web
  become: no
  tasks:
    - name: Check HTTP response status
      uri:
        url: "http://localhost"
        return_content: yes
        status_code: 200
      register: http_response
      tags: verify

    - name: Display HTTP response status
      debug:
        msg: "HTTP Status: {{ http_response.status }}"
      tags: verify

    - name: Verify index.html content is served
      uri:
        url: "http://localhost"
        return_content: yes
      register: page_content
      failed_when: "'html' not in page_content.content"
      tags: verify

    - name: Display deployment success message
      debug:
        msg: "✅ Mini Finance website deployed successfully!"
      tags: verify
