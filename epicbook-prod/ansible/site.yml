---
- name: Deploy EpicBook Application
  hosts: web
  become: true
  
  pre_tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        timeout: 300
    
    - name: Gather facts
      setup:

  roles:
    - common
    - nginx
    - epicbook
    - mysql

  post_tasks:
    - name: Restart EpicBook service after database setup
      systemd:
        name: epicbook
        state: restarted
    
    - name: Wait for application to start
      wait_for:
        port: 8080
        delay: 5
        timeout: 30
    
    - name: Verify Nginx is running
      service:
        name: nginx
        state: started
      
    - name: Verify MySQL is running
      service:
        name: mysql
        state: started
    
    - name: Verify EpicBook service is running
      service:
        name: epicbook
        state: started
    
    - name: Check if site is accessible
      uri:
        url: "http://{{ ansible_host }}"
        status_code: 200
        timeout: 30
      delegate_to: localhost
      become: false
      retries: 3
      delay: 10
